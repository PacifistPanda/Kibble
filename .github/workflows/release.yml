name: Release

# Push a tag like v1.3.2 (after bumping "## Version" in Kibble.toc and adding a CHANGELOG.md section)
# and this tests the addon, builds Kibble-v1.3.2.zip and publishes a GitHub release with the
# CHANGELOG section as its notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Test
        run: luajit tests/smoke.lua Kibble.lua

      - name: Build the zip (fails if the tag does not match the TOC version)
        id: build
        run: echo "zip=$(scripts/package.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "Kibble ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            --verify-tag
